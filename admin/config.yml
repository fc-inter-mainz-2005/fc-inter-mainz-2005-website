backend:
  name: git-gateway
  branch: main
media_folder: "fotos"
public_folder: "/fotos"
collections:
  - name: "hero"
    label: "Startseite – Titelbilder (Slideshow)"
    files:
      - label: "Fotos"
        name: "slides"
        file: "data/hero.json"
        fields:
          - label: "Bilder"
            name: "slides"
            widget: "list"
            summary: "{{fields.image}}"
            fields:
              - {label: "Foto", name: "image", widget: "image"}

  - name: "termine"
    label: "Neuigkeiten"
    files:
      - label: "Neuigkeiten Liste"
        name: "termine_file"
        file: "data/events.json"
        fields:
          - label: "Neuigkeiten"
            name: "events"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Titel", name: "name", widget: "string"}
              - {label: "Kurzinfo", name: "meta", widget: "string", required: false}
              - {label: "Beschreibung", name: "description", widget: "text", required: false}
              - {label: "Foto (optional – Mini-Vorschau)", name: "image", widget: "image", required: false}
              - {label: "Link-Text", name: "link_text", widget: "string", required: false, default: "📷 Fotos ansehen"}
              - {label: "Link-URL", name: "link_url", widget: "string", required: false}

  - name: "vorstand"
    label: "Vorstand – Vereinsführung"
    files:
      - label: "Mitglieder"
        name: "mitglieder"
        file: "data/vorstand.json"
        fields:
          - label: "Mitglieder"
            name: "members"
            widget: "list"
            summary: "{{fields.name}} – {{fields.role}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Position", name: "role", widget: "string"}
              - {label: "Foto", name: "photo", widget: "image"}

  - name: "vorstand_abteilung"
    label: "Vorstand – Abteilungsverantwortliche"
    files:
      - label: "Mitglieder"
        name: "mitglieder"
        file: "data/vorstand_abteilung.json"
        fields:
          - label: "Mitglieder"
            name: "members"
            widget: "list"
            summary: "{{fields.name}} – {{fields.role}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Zuständigkeit", name: "role", widget: "string"}
              - {label: "Foto", name: "photo", widget: "image"}

  - name: "sponsoren"
    label: "Sponsoren"
    files:
      - label: "Liste"
        name: "liste"
        file: "data/sponsors.json"
        fields:
          - label: "Sponsoren"
            name: "sponsors"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Logo", name: "image", widget: "image"}
              - {label: "Link", name: "link", widget: "string"}

  - name: "teams"
    label: "Mannschaften"
    files:
      - label: "Team-Liste"
        name: "liste"
        file: "data/teams.json"
        fields:
          - label: "Mannschaften"
            name: "teams"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Name der Mannschaft", name: "name", widget: "string"}
              - {label: "Liga / Klasse", name: "liga", widget: "string"}
              - {label: "Mannschaftsfoto", name: "photo", widget: "image"}
              - {label: "Link zu FuPa (kompletter Kader)", name: "fupa_link", widget: "string", required: false}

  - name: "geschichte"
    label: "Geschichte – Fotos"
    files:
      - label: "Fotos"
        name: "fotos"
        file: "data/geschichte.json"
        fields:
          - {label: "Foto: Die Gründung (2005)", name: "gruendung", widget: "image"}
          - {label: "Foto: Aufstieg & Wachstum (2023)", name: "aufstieg", widget: "image"}
          - {label: "Foto: Der moderne Verein (Heute)", name: "heute", widget: "image"}

  - name: "kontakt"
    label: "Kontaktdaten"
    files:
      - label: "Anschrift & E-Mail"
        name: "daten"
        file: "data/kontakt.json"
        fields:
          - {label: "Bezeichnung (z.B. Bezirkssportanlage Mainz)", name: "anschrift_name", widget: "string"}
          - {label: "Straße & Hausnummer", name: "strasse", widget: "string"}
          - {label: "PLZ & Ort", name: "plz_ort", widget: "string"}
          - {label: "E-Mail Adresse", name: "email", widget: "string"}

  - name: "statistiken"
    label: "Statistik-Leiste (Mitgliederzahl)"
    files:
      - label: "Werte"
        name: "werte"
        file: "data/stats.json"
        fields:
          - {label: "Mitglieder (z.B. 90+)", name: "mitglieder", widget: "string"}

  - name: "downloads"
    label: "Downloadcenter"
    files:
      - label: "Dokumente"
        name: "dokumente"
        file: "data/downloads.json"
        fields:
          - label: "Karten"
            name: "cards"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Titel", name: "title", widget: "string"}
              - {label: "Beschreibung", name: "description", widget: "text"}
              - {label: "Datei", name: "file", widget: "file", media_folder: "/documents", public_folder: "/documents"}
              - {label: "Dateiname beim Download", name: "filename", widget: "string"}

  - name: "probetraining"
    label: "Probetraining-Hinweis"
    files:
      - label: "Hinweis"
        name: "hinweis"
        file: "data/probetraining.json"
        fields:
          - {label: "Hinweis anzeigen?", name: "show_hinweis", widget: "boolean", default: true}
          - {label: "Text", name: "hinweis_text", widget: "text", required: false}

  - name: "impressum"
    label: "Impressum"
    files:
      - label: "Inhalt"
        name: "inhalt"
        file: "content/impressum.json"
        fields:
          - {label: "Text (Markdown)", name: "content", widget: "markdown"}

  - name: "datenschutz"
    label: "Datenschutzerklärung"
    files:
      - label: "Inhalt"
        name: "inhalt"
        file: "content/datenschutz.json"
        fields:
          - {label: "Text (Markdown)", name: "content", widget: "markdown"}
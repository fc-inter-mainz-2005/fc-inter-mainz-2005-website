name: Deploy Inter Mainz Website
on:
  push:
    branches:
      - main  # Se activa cada vez que subas cambios a la rama main

jobs:
  web-deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 🚀 Sync files to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./             # Sube todo el contenido del repo
          server-dir: ./htdocs/     # Lo mete directo en htdocs del hosting
          protocol: ftp
          port: 21
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitglied werden - F.C. Inter Mainz</title>
    <link rel="icon" type="image/png" href="../800x800.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-primary-blue { background-color: #003366; }
        .text-primary-blue { color: #003366; }
        .bg-primary-red { background-color: #d70000; }
        .text-primary-red { color: #d70000; }
        .border-primary-red { border-color: #d70000; }
        
        /* Estilo para el botón deshabilitado */
        #submit-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <nav class="bg-primary-blue p-4 shadow-md fixed w-full z-50 top-0">
        <div class="container mx-auto flex flex-wrap items-center justify-between">
            <a href="../index.html" class="flex items-center text-white no-underline hover:no-underline font-bold text-xl lg:text-2xl">
                <img src="../800x800.png" alt="F.C. Inter Mainz Wappen" class="h-10 mr-3">
                F.C. Inter Mainz
            </a>
            <div class="hidden lg:block">
                <a href="../index.html" class="text-white hover:text-primary-red px-4 transition">Zurück zur Startseite</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto pt-32 pb-20 px-4">
        <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-2xl overflow-hidden">
            <div class="bg-primary-blue p-8 text-white text-center">
                <h1 class="text-3xl font-bold uppercase tracking-tight">Mitgliedschaft anfragen</h1>
                <p class="mt-2 text-blue-200">Werde Teil unserer Mannschaft im Herzen von Mainz.</p>
            </div>

            <div class="bg-red-50 border-l-4 border-primary-red p-4 mx-8 mt-8">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-primary-red" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm text-primary-red font-bold uppercase">
                            Wichtiger Hinweis:
                        </p>
                        <p class="text-sm text-red-700">
                            Aktuell nehmen wir ausschließlich männliche Spieler für unsere Kader auf.
                        </p>
                    </div>
                </div>
            </div>

            <form id="membership-form" class="p-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Vorname *</label>
                        <input type="text" name="vorname" required 
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary-blue focus:border-transparent outline-none transition"
                            placeholder="Dein Vorname">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Nachname *</label>
                        <input type="text" name="name" required 
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary-blue focus:border-transparent outline-none transition"
                            placeholder="Dein Nachname">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Alter *</label>
                        <input type="number" name="alter" required 
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary-blue focus:border-transparent outline-none transition"
                            placeholder="z.B. 25">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Geburtsdatum *</label>
                        <input type="date" name="geburtsdatum" required 
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary-blue focus:border-transparent outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">E-Mail Adresse *</label>
                    <input type="email" name="email" required 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary-blue focus:border-transparent outline-none transition"
                        placeholder="beispiel@mail.de">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Handynummer (optional)</label>
                    <input type="tel" name="telefon" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary-blue focus:border-transparent outline-none transition"
                        placeholder="+49 123 4567890">
                </div>

                <div class="flex items-start">
                    <div class="flex items-center h-5">
                        <input id="privacy-check" type="checkbox" required
                            class="focus:ring-primary-red h-4 w-4 text-primary-red border-gray-300 rounded cursor-pointer">
                    </div>
                    <div class="ml-3 text-sm">
                        <label for="privacy-check" class="font-medium text-gray-700">
                            Ich akzeptiere die 
                            <a href="includes/datenschutzbestimmung.html" class="text-primary-red hover:underline font-bold">Datenschutzbestimmungen</a> 
                            und stimme der Verarbeitung meiner Daten zu. *
                        </label>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" id="submit-btn" disabled
                        class="w-full bg-primary-red text-white font-bold py-4 px-8 rounded-lg shadow-lg transition transform hover:-translate-y-1 active:scale-95 uppercase tracking-wider">
                        Anfrage senden
                    </button>
                    <p class="text-xs text-gray-500 mt-4 text-center">
                        * Pflichtfelder müssen ausgefüllt werden.
                    </p>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-gray-800 text-gray-400 py-8 text-center text-sm">
        <p>&copy; 2026 F.C. Inter Mainz | <a href="impressum.html" class="hover:text-white">Impressum</a></p>
    </footer>

    <script>
    const privacyCheck = document.getElementById('privacy-check');
    const submitBtn = document.getElementById('submit-btn');
    const form = document.getElementById('membership-form');

    // Habilitar/Deshabilitar botón según el checkbox
    privacyCheck.addEventListener('change', function() {
        submitBtn.disabled = !this.checked;
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Crear un objeto FormData con los datos del formulario
        const formData = new FormData(form);

        // Enviar datos al PHP mediante fetch
        fetch('php/mitgliedConsultSaveInDB.php', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.saveStatus) {
                alert('Vielen Dank! Deine Anfrage wurde erfolgreich gespeichert.');
                form.reset(); // Limpiar formulario
                submitBtn.disabled = true; // Volver a deshabilitar
            } else {
                alert('Fehler: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Es gab ein Problem beim Senden der Anfrage.');
        });
    });
</script>
    
</body>
</html>
